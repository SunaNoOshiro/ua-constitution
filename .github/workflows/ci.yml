name: CI

# Build, unit tests, and the detekt complexity gate on every push / PR.
# Mirrors the documented local command: JDK 21 (the toolchain Gradle 9.x requires) and
# -x downloadAnthem so the build never depends on the network (anthem.ogg is committed).

on:
  push:
    branches: [main, refactor/solid]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + detekt + assemble
        run: ./gradlew :app:testDebugUnitTest :app:detekt :app:assembleDebug -x downloadAnthem
